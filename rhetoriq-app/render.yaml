services:
  - type: web
    name: rhetoriq
    runtime: node
    region: frankfurt
    nodeVersion: 22
    healthCheckPath: /health
    plan: starter   # must not be free — free tier spins down after 15min idle, causing 50s+ cold-start failures for real customers
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rhetoriq-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false   # set manually in Render dashboard
      - key: ADVISOR_EMAIL
        sync: false
      - key: ADVISOR_PASSWORD
        sync: false
      - key: ADVISOR_NOTIFY_EMAIL_2
        sync: false   # optional: zweite Adresse für Warnungen und Berichte
      - key: ADVISOR_NAME
        value: Lorena Lienhard
      - key: NODE_VERSION
        value: "22"   # Render liest die Node-Version aus dieser Variable (Node 20 erhält keine Sicherheitsupdates mehr)
      - key: NODE_ENV
        value: production
      - key: SENTRY_DSN
        sync: false   # set in Render dashboard — get DSN from sentry.io
      - key: STRIPE_SECRET_KEY
        sync: false   # set in Render dashboard — from Stripe dashboard
      - key: STRIPE_WEBHOOK_SECRET
        sync: false   # set in Render dashboard — from Stripe webhook settings
      - key: SECRETS_ENCRYPTION_KEY
        sync: false   # set in Render dashboard — 64 hex characters (openssl rand -hex 32), never change after first use
      - key: GOOGLE_CLIENT_ID
        sync: false   # set in Render dashboard — OAuth-Client (Webanwendung) aus Google Cloud, für die Kalender-Synchronisation
      - key: GOOGLE_CLIENT_SECRET
        sync: false   # set in Render dashboard — Client-Geheimnis desselben OAuth-Clients, nie im Code oder Chat
      - key: CORS_ORIGIN
        value: https://rhetoriq.ch
      - key: APP_URL
        value: https://rhetoriq.ch
      - key: COST_BRAKE_PLATFORM_DAILY_USD
        value: "40"   # harte Tagesgrenze für die ganze Plattform (Beraterin ausgenommen)
      - key: COST_BRAKE_CLIENT_DAILY_USD
        value: "10"   # harte Tagesgrenze je Klient
      - key: COST_ALERT_THRESHOLD_USD
        value: "5"   # advisor gets an email if a single client crosses this in API costs on one day

databases:
  - name: rhetoriq-db
    databaseName: rhetoriq
    user: rhetoriq
    plan: starter   # Starter Postgres includes Render's own automatic daily
                    # backups (Dashboard -> rhetoriq-db -> Backups, with
                    # restore). The custom rhetoriq-backup cron job that used
                    # to run here was removed: it wrote pg_dump output to the
                    # cron container's own local disk, which is ephemeral and
                    # gets wiped after every run — every backup it ever made
                    # was destroyed immediately after logging "success". It
                    # never protected anything; this real, platform-level
                    # backup is the actual safety net.
    region: frankfurt
