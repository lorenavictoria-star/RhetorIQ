<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>RhetorIQ</title>
  <style>
    body{font-family:'Segoe UI',Arial,sans-serif;margin:0;padding:16px;width:260px;color:#1F2937;background:#fff;font-size:13px}
    h1{font-size:15px;margin:0 0 4px;color:#1B4D2E}
    .sub{font-size:11px;color:#6B7280;margin:0 0 14px}
    label{display:block;font-size:11px;font-weight:600;color:#6B7280;margin:10px 0 4px;text-transform:uppercase;letter-spacing:.04em}
    input{width:100%;box-sizing:border-box;padding:8px 10px;border:1.5px solid #DDE3DF;border-radius:6px;font-size:13px;font-family:inherit;color:#1F2937}
    button{width:100%;padding:9px;border:none;border-radius:6px;background:#1B4D2E;color:#fff;font-size:13px;font-weight:600;cursor:pointer;margin-top:14px}
    button:disabled{opacity:.5}
    #err{color:#b91c1c;font-size:12px;margin-top:8px;display:none}
    #logged-in{display:none;text-align:center}
    #logged-in .status{color:#047857;font-size:13px;margin-bottom:10px}
    button.secondary{background:#fff;color:#1B4D2E;border:1.5px solid #1B4D2E}
    .hint{font-size:11px;color:#6B7280;margin-top:12px;line-height:1.5}
  </style>
</head>
<body>
  <h1>RhetorIQ</h1>
  <div class="sub">Text überall generieren</div>

  <div id="login-view">
    <label>E-Mail</label>
    <input type="email" id="email">
    <label>Passwort</label>
    <input type="password" id="pw">
    <button id="login-btn">Anmelden</button>
    <div id="err"></div>
  </div>

  <div id="logged-in">
    <div class="status">✓ Angemeldet</div>
    <button class="secondary" id="logout-btn">Abmelden</button>
    <div class="hint">Klicken Sie in ein beliebiges Textfeld auf einer Webseite — das RhetorIQ-Symbol erscheint automatisch daneben.</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
