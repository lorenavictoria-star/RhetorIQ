version: 2
updates:
  - package-ecosystem: npm
    directory: /rhetoriq-app/server
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      kleine-aenderungen:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
